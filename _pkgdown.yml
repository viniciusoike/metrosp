url: https://viniciusoike.github.io/metrosp/

template:
  bootstrap: 5
  bslib:
    bootswatch: yeti
    pkgdown-nav-height: 100px
    base_font: {google: "Roboto"}
    heading_font: {google: "Lora"}
    code_font: {google: "JetBrains Mono"}
    "code-font-size": 0.82em
    primary: "#171796"
    bg: "#fefefe"
    fg: "#000000"

reference:
- title: Demand datasets
  desc: Passenger counts by line and by station.
  contents:
  - line_entries_monthly
  - line_transported_monthly
  - station_entries_monthly
  - station_entries_daily

- title: Spatial and reference datasets
  desc: Geometries and lookup tables.
  contents:
  - rail_lines
  - rail_stations
  - calendar_spo
  - metro_colors

- title: Published data
  desc: Read data newer than the bundled snapshot, and manage the download cache.
  contents:
  - read_metro_demand
  - metrosp_cache_dir
  - metrosp_cache_enable
  - metrosp_cache_list
  - metrosp_cache_clear

articles:
- title: Articles
  navbar: ~
  contents:
  - getting_started
  - data-dictionary
  - articles/metro-demand-data
