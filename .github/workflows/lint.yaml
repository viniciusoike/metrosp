# Lint changed R files with lintr. Failure is advisory today; make it a
# required check on main only after the existing code passes clean.
on:
  push:
    branches: [main]
  pull_request:

name: lint

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::cyclocomp
          needs: lint

      - name: Lint package
        run: lintr::lint_package()
        shell: Rscript {0}
