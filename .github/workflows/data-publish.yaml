# Publish the current data batch to the rolling `data-latest` release.
#
# Runs after a data-refresh PR merges. Rebuilds offline from the merged CSVs --
# no network sources, because everything the graph reads is now committed --
# then uploads data-raw/cache/*.rds plus manifest.json.
#
# Splitting this from data-refresh.yaml is what keeps a human in the loop: the
# refresh proposes, the merge decides, and only then does anything become
# publicly fetchable.

on:
  push:
    branches: [main]
    paths:
      - "data-raw/processed/**"
      - "data-raw/geosampa/**"
      - "data-raw/station_inauguration.csv"
      - "data-raw/R/**"
  workflow_dispatch:

name: data-publish.yaml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: data-publish
      cancel-in-progress: false
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The block below mirrors tar_option_set(packages = ) in
          # data-raw/_targets.R. Those packages are pipeline-only, so they are
          # deliberately absent from DESCRIPTION and have to be named here; a
          # missing one fails tar_make() at load time, before any target runs.
          extra-packages: >-
            any::targets,
            any::tarchetypes,
            any::piggyback,
            any::devtools,
            any::data.table,
            any::fs,
            any::glue,
            any::here,
            any::janitor,
            any::lubridate,
            any::purrr,
            any::readr,
            any::rlang,
            any::rvest,
            any::stringi,
            any::stringr,
            any::tibble,
            any::tidyr,
            local::.

      # No refresh flags: this rebuilds purely from committed inputs, so the
      # published assets correspond exactly to the merged commit.
      - name: Rebuild from committed sources
        run: Rscript -e 'targets::tar_make()'

      - name: Verify the snapshot did not move
        run: |
          # data/*.rda is frozen. If a rebuild from committed CSVs changes it,
          # the tree and the snapshot disagree and the freeze is a fiction.
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "::error::data/*.rda changed during an unflagged rebuild."
            git status --porcelain data/
            exit 1
          fi
          echo "Snapshot intact."

      - name: Run package tests
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'

      - name: Publish to data-latest
        run: Rscript data-raw/ci_publish.R
